<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubastaYa - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
    <div data-navigation></div>

    <main class="container py-5">
        <div class="row justify-content-center g-4">
            <div class="col-12 col-md-6 col-lg-5">
                <section class="sy-panel p-4">
                    <h1 class="h4 mb-1">Iniciar sesión</h1>
                    <p class="sy-muted small mb-4">Ingresá con una de las cuentas de prueba para operar.</p>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="emailField">Email</label>
                            <input type="email" class="form-control" id="emailField" required
                                   autocomplete="username" placeholder="comprador1@test.com" />
                            <div class="invalid-feedback">Ingresá un email válido.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="passwordField">Contraseña</label>
                            <input type="password" class="form-control" id="passwordField" required
                                   autocomplete="current-password" placeholder="Password123!" />
                            <div class="invalid-feedback">La contraseña es obligatoria.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="signInButton">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                        </button>
                    </form>
                </section>
            </div>

            <div class="col-12 col-md-6 col-lg-5">
                <section class="sy-panel p-4 h-100">
                    <h2 class="h6 mb-3"><i class="bi bi-people me-2"></i>Cuentas de prueba</h2>
                    <p class="sy-muted small">
                        Todas usan la contraseña <code>Password123!</code>. Tocá una para cargarla.
                    </p>

                    <div class="list-group list-group-flush" id="accountList"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/login.js"></script>
</body>
</html>
