<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubastaYa - Sala de subasta en vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
    <div data-navigation></div>

    <main class="container py-4">
        <a href="/index.html" class="sy-muted small d-inline-block mb-3">
            <i class="bi bi-arrow-left me-1"></i>Volver al catálogo
        </a>

        <div id="roomContent" aria-live="polite"></div>

        <!--
            La sala se arma desde esta plantilla una sola vez. Después las actualizaciones tocan
            nodos puntuales en lugar de rehacer el HTML entero, para no perder el foco del campo
            de monto ni cortar la animación del contador mientras llegan ofertas.
        -->
        <template id="roomTemplate">
            <div class="row g-4">
                <!-- Columna izquierda: producto e historial de ofertas -->
                <div class="col-12 col-lg-7">
                    <section class="sy-panel overflow-hidden mb-4">
                        <img id="productImage" class="w-100" style="max-height: 22rem; object-fit: cover;" alt="" />
                        <div class="p-3 p-md-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span id="auctionStatus"></span>
                                <span class="sy-muted small">
                                    <i class="bi bi-tag me-1"></i><span id="auctionCategory"></span>
                                </span>
                            </div>
                            <h1 class="h4" id="auctionTitle"></h1>
                            <p class="sy-muted mb-3" id="auctionDescription"></p>
                            <div class="d-flex flex-wrap gap-4 small sy-muted">
                                <span><i class="bi bi-person me-1"></i>Vendedor: <span id="auctionSeller"></span></span>
                                <span><i class="bi bi-cash-coin me-1"></i>Precio base: <span id="startingPrice"></span></span>
                                <span><i class="bi bi-plus-slash-minus me-1"></i>Incremento mínimo: <span id="minimumIncrement"></span></span>
                            </div>
                        </div>
                    </section>

                    <section class="sy-panel p-3 p-md-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h6 mb-0"><i class="bi bi-clock-history me-2"></i>Historial de ofertas</h2>
                            <span class="sy-muted small" id="liveConnection"></span>
                        </div>
                        <div class="sy-history" id="bidHistory"></div>
                    </section>
                </div>

                <!-- Columna derecha: reloj y consola de puja -->
                <div class="col-12 col-lg-5">
                    <section class="sy-panel p-3 p-md-4 mb-4 text-center">
                        <div class="sy-metric-label mb-1" id="clockLabel">Tiempo restante</div>
                        <div class="sy-clock-large" id="auctionClock"></div>
                        <div class="sy-muted small mt-2">
                            Cierra el <span id="closingDate"></span>
                        </div>
                    </section>

                    <section class="sy-panel p-3 p-md-4 mb-4">
                        <div class="sy-metric-label">Oferta líder actual</div>
                        <div class="sy-amount my-2" id="currentAmount"></div>
                        <div class="sy-muted small mb-3">
                            <span id="bidCount"></span> oferta(s) · líder: <span id="leadingBidder">sin ofertas</span>
                        </div>
                        <div id="bidderIndicator" class="sy-indicator sy-indicator-neutral"></div>
                    </section>

                    <section class="sy-panel p-3 p-md-4">
                        <h2 class="h6 mb-3"><i class="bi bi-hammer me-2"></i>Consola de puja</h2>

                        <div id="balanceBlock" class="sy-panel-raised p-3 mb-3 small d-none">
                            <div class="d-flex justify-content-between">
                                <span class="sy-muted">Saldo disponible</span>
                                <strong id="availableBalance"></strong>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="sy-muted">Retenido en garantía</span>
                                <span id="heldBalance"></span>
                            </div>
                        </div>

                        <form id="bidForm" novalidate>
                            <label class="form-label small sy-muted" for="bidAmount">Monto a ofertar</label>
                            <div class="input-group mb-2">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="bidAmount" step="any" required />
                            </div>
                            <div class="sy-muted small mb-3" id="bidHelp"></div>

                            <button type="submit" class="btn btn-primary w-100" id="bidButton">
                                <i class="bi bi-hammer me-1"></i>Confirmar oferta
                            </button>
                        </form>

                        <div id="blockedMessage" class="sy-muted small mt-3 text-center"></div>
                    </section>
                </div>
            </div>
        </template>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script type="module" src="/js/auction-room.js"></script>
</body>
</html>
