<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubastaYa - Mis actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
    <div data-navigation></div>

    <main class="container py-4">
        <header class="mb-4">
            <h1 class="h3 mb-1">Mis actividades</h1>
            <p class="sy-muted mb-0">Seguí tus pujas y el rendimiento de tus publicaciones.</p>
        </header>

        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="participationsTab" data-bs-toggle="tab"
                        data-bs-target="#participationsPane" type="button" role="tab"
                        aria-controls="participationsPane" aria-selected="true">
                    <i class="bi bi-hammer me-1"></i>Mis compras / pujas
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="publicationsTab" data-bs-toggle="tab"
                        data-bs-target="#publicationsPane" type="button" role="tab"
                        aria-controls="publicationsPane" aria-selected="false">
                    <i class="bi bi-megaphone me-1"></i>Mis publicaciones
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="participationsPane" role="tabpanel"
                 aria-labelledby="participationsTab">
                <section class="sy-panel p-3 p-md-4" id="participationsPanel" aria-live="polite"></section>
            </div>
            <div class="tab-pane fade" id="publicationsPane" role="tabpanel" aria-labelledby="publicationsTab">
                <section class="sy-panel p-3 p-md-4" id="publicationsPanel" aria-live="polite"></section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/activity.js"></script>
</body>
</html>
